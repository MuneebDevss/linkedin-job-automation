<!doctype html>
<meta charset="utf-8">
<title>Job Post → n8n</title>
<style>
  body{font:14px system-ui;width:420px;padding:16px;background:#f3f6fa;color:#172238}
  label{display:block;margin-top:12px}
  input,textarea{box-sizing:border-box;width:100%;padding:8px}
  textarea{height:150px}
  button{padding:9px;margin:10px 5px 0 0}
  pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto}
</style>
<h2>Job Post → n8n</h2>
<p>Select a job post (and expand “see more” if needed), then open this popup. Links are optional. The preview is captured automatically and is never sent until you click Send.</p>
<label>Local webhook URL<input id="url" value="http://localhost:5678/webhook-test/linkedin-job"></label>
<label>Post URL<input id="postUrl"></label>
<label>Preview / edit post text<textarea id="text"></textarea></label>
<label>Application links (one per line)<textarea id="links" style="height:70px"></textarea></label>
<button id="send" disabled>Send to n8n</button>
<pre id="result" role="status" aria-live="polite">Detecting the selected post…</pre>
<script src="popup.js"></script>
