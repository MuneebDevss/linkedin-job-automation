services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Karachi
      GENERIC_TIMEZONE: Asia/Karachi
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files/resumes
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/muneeburrehman/Documents/Resumes:/files/resumes:ro,z
    restart: unless-stopped
volumes:
  n8n_data:
