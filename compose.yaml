services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      TZ: Asia/Karachi
      DATABASE_PATH: /app/data/jobs.sqlite
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/linkedin-job
      N8N_TIMEOUT_MS: 20000
      URL_RESOLUTION_TIMEOUT_MS: 8000
      API_TOKEN: ${BACKEND_API_TOKEN:-}
      PROFILE_PATH: /app/data/profile.json
      PROFILE_TEMPLATE_PATH: /app/profile.default.json
      GEMINI_TIMEOUT_MS: 30000
      FORM_AUTOMATION_ENABLED: "true"
      FORM_AUTO_SUBMIT: "true"
      FORM_ALLOW_LOCALHOST: "false"
      FORM_TIMEOUT_MS: 90000
      FORM_NAVIGATION_TIMEOUT_MS: 30000
      FORM_MAX_RETRIES: 1
      FORM_MAX_PAGES: 10
      FORM_ARTIFACTS_DIRECTORY: /app/data/form-artifacts
      RESUME_DIRECTORY: /files/resumes
      APPLICATION_DOCUMENTS_DIRECTORY: /files/resumes
      FORM_AUTH_STATE_PATH: /app/data/playwright/google-storage-state.json
      FORM_AUTH_LOGIN_URL: ${FORM_AUTH_LOGIN_URL:-https://accounts.google.com/}
      FORM_AUTH_LOGIN_TIMEOUT_MS: 300000
      FORM_AUTH_CDP_URL: ""
      PLAYWRIGHT_HEADLESS: "true"
      PLAYWRIGHT_BROWSER_EXECUTABLE_PATH: ""
    volumes:
      - backend_data:/app/data
      - ./backend/data/playwright:/app/data/playwright:Z
      - /home/muneeburrehman/Documents/Resumes:/files/resumes:ro,z
    depends_on:
      - n8n
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Karachi
      GENERIC_TIMEZONE: Asia/Karachi
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files/resumes
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/muneeburrehman/Documents/Resumes:/files/resumes:ro,z
    restart: unless-stopped
volumes:
  backend_data:
  n8n_data:
