services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/jobs.sqlite
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/linkedin-job
      N8N_TIMEOUT_MS: 20000
      URL_RESOLUTION_TIMEOUT_MS: 8000
      API_TOKEN: ${BACKEND_API_TOKEN:-}
    volumes:
      - backend_data:/app/data
    depends_on:
      - n8n
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Karachi
      GENERIC_TIMEZONE: Asia/Karachi
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RESTRICT_FILE_ACCESS_TO: /files/resumes
    volumes:
      - n8n_data:/home/node/.n8n
      - /home/muneeburrehman/Documents/Resumes:/files/resumes:ro,z
    restart: unless-stopped
volumes:
  backend_data:
  n8n_data:
